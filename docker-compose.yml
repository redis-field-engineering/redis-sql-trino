services:

  redis:
    profiles: [oss]
    image: redis:8.4
    hostname: redis
    container_name: redis
    ports:
      - "6379:6379"
    restart: always

  redis-cli:
    profiles: [oss]
    image: redis:8.4
    depends_on:
      - redis
    command: "redis-cli -h redis FT.CREATE beers ON HASH PREFIX 1 beer: SCHEMA id TAG SORTABLE brewery_id TAG SORTABLE name TEXT SORTABLE abv NUMERIC SORTABLE descript TEXT style_name TAG SORTABLE cat_name TAG SORTABLE"

  riot:
    profiles: [oss]
    image: fieldengineering/riot
    depends_on:
      - redis
    command: -h redis file-import https://storage.googleapis.com/jrx/beers.json hset --keyspace beer --keys id
    
  # Stock Trino with the locally built plugin mounted in. Build it first: ./mvnw package -DskipTests
  trino:
    image: trinodb/trino:483
    hostname: trino
    container_name: trino
    ports:
      - "8080:8080"
    environment:
      REDISEARCH_URI: ${REDISEARCH_URI:?Set REDISEARCH_URI to your Redis Software or Redis Cloud database}
      REDISEARCH_USERNAME: ${REDISEARCH_USERNAME:-}
      REDISEARCH_PASSWORD: ${REDISEARCH_PASSWORD:-}
      REDISEARCH_CLUSTER: ${REDISEARCH_CLUSTER:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["bash", "/tmp/setup.sh"]
    volumes:
      - ./target/redis-sql-trino-${REDIS_SQL_TRINO_VERSION:-0.4.2-SNAPSHOT}:/usr/lib/trino/plugin/redisearch:ro
      - ./docker/setup.sh:/tmp/setup.sh:ro
