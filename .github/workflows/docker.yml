name: Docker

on:
  workflow_call:
    inputs:
      tags:
        required: true
        type: string
      platforms:
        default: 'linux/amd64,linux/arm64'
        required: false
        type: string
    secrets:
      docker-username:
        required: true
      docker-password:
        required: true

# Inlined from redis-github-workflows docker.yml, which pins Node 20 actions
# that GitHub has deprecated. build-push-action builds from the Git context, so no checkout is
# needed, and the Dockerfile has no RUN in its per-platform stage, so no QEMU is needed either.
jobs:
  docker:
    name: 'Docker'
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.docker-username }}
          password: ${{ secrets.docker-password }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ inputs.tags }}
          platforms: ${{ inputs.platforms }}
