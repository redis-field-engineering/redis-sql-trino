name: Build

on:
  pull_request:

# Inlined from redis-github-workflows build-maven.yml, which hard-codes the Zulu JDK;
# trino-root's enforcer rules only accept Temurin or Oracle.
jobs:
  oss-compatibility:
    name: 'Redis OSS ${{ matrix.redis }} compatibility'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        redis: ['8.4', '8.10.3']
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: 'temurin'
          cache: maven
      - name: Test SQL and cursor compatibility
        run: >-
          ./mvnw -B test
          -Dredisearch.test.oss-image=redis:${{ matrix.redis }}
          -Djunit.jupiter.execution.parallel.enabled=false
          -Dtest=TestWrites,TestAtomicHashWrites,TestAtomicHashAcl,TestNativeSearch,TestAggregationPushdown,TestTagAndLikePushdown,TestSqlRelationMetadata,TestCursorReads,TestExactDistinctPushdown,TestCanonicalGrouping,TestExactLocalTopN,TestResp2ExactTopN,TestGroupingFunctionProbes,TestLikePatternPushdown,TestFiniteGroupingBounds,TestJsonLocalTopN,TestResp2JsonLocalTopN,TestJsonValues,TestColumnOrdering
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: oss-${{ matrix.redis }}-test-reports
          path: target/surefire-reports/

  build:
    name: 'Build'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: 'temurin'

      - name: Cache Maven
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build
        run: ./mvnw -B package --file pom.xml

      # Runs the packaged plugin from the Build step in a trinodb/trino container
      - name: Product tests
        run: ./mvnw -B -Pproduct-tests failsafe:integration-test failsafe:verify --file pom.xml

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            target/
